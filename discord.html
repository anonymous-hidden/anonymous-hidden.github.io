<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10151e">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="stylesheet" href="/assets/bio.css">
  <meta name="description" content="Find Cayden on Discord.">
  <title>Discord | Cayden</title>
</head>
<body>
  <main class="utility">
    <a class="back-link" href="/"><span aria-hidden="true">←</span> Back to my bio</a>
    <section class="surface utility-card" aria-labelledby="discord-title">
      <p class="utility-label"><svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="currentColor"><path d="M19.5 5.34A16.3 16.3 0 0 0 15.44 4l-.5 1.03a15.1 15.1 0 0 0-5.87 0L8.56 4A16.5 16.5 0 0 0 4.5 5.35C1.93 9.2 1.24 12.96 1.59 16.66a16.5 16.5 0 0 0 4.98 2.51l1.2-1.65a10.6 10.6 0 0 1-1.89-.9l.46-.36c3.64 1.69 7.6 1.69 11.2 0l.48.36c-.6.36-1.23.66-1.9.9l1.2 1.65a16.5 16.5 0 0 0 4.98-2.51c.42-4.29-.73-8.01-2.8-11.32ZM8.62 14.4c-1.1 0-2-1.01-2-2.25s.88-2.25 2-2.25c1.12 0 2.02 1.02 2 2.25 0 1.24-.88 2.25-2 2.25Zm6.77 0c-1.1 0-2-1.01-2-2.25s.88-2.25 2-2.25c1.12 0 2.02 1.02 2 2.25 0 1.24-.88 2.25-2 2.25Z"/></svg><span>Discord</span></p>
      <h1 id="discord-title">Say hi.</h1>
      <p class="utility-copy">Discord is the easiest place to reach me. Add me using the username below.</p>
      <div class="username-box">
        <span class="small-label">Discord username</span>
        <code class="discord-username" id="username">niceman69400000</code>
      </div>
      <button class="button" id="copyButton" type="button" hidden>Copy username</button>
      <p class="status-message" id="copyStatus" role="status" aria-live="polite">Select the username to copy it.</p>
    </section>
  </main>
  <script>
    (() => {
      const button = document.getElementById("copyButton");
      const username = document.getElementById("username");
      const status = document.getElementById("copyStatus");
      let resetTimer;
      button.hidden = false;
      status.textContent = "Copy it, then add me as a friend in Discord.";

      button.addEventListener("click", async () => {
        clearTimeout(resetTimer);
        button.disabled = true;
        button.setAttribute("aria-busy", "true");
        button.textContent = "Copying…";
        try {
          if (!navigator.clipboard?.writeText) throw new Error("Clipboard unavailable");
          await navigator.clipboard.writeText(username.textContent.trim());
          button.textContent = "Copied";
          status.textContent = "Username copied. See you on Discord.";
        } catch {
          button.textContent = "Copy username";
          status.textContent = "Couldn’t copy automatically. Select the username above to copy it.";
        } finally {
          button.disabled = false;
          button.removeAttribute("aria-busy");
          resetTimer = setTimeout(() => {
            button.textContent = "Copy username";
          }, 2500);
        }
      });
    })();
  </script>
</body>
</html>
