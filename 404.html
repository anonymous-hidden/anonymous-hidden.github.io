<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <title>Page Not Found | Cayden</title>
  <style>
    :root { color-scheme: dark; --bg: #050505; --panel: #0d0d0d; --line: #242424; --text: #f5f5f2; --muted: #9b9b96; --green: #91f2ae; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; text-align: center; }
    main { width: min(100%, 560px); padding: clamp(36px, 8vw, 64px); border: 1px solid var(--line); border-radius: 22px; background: var(--panel); }
    .code { margin: 0 0 18px; color: var(--green); font-size: 0.82rem; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; }
    h1 { margin: 0 0 14px; font-size: clamp(2.6rem, 10vw, 4.6rem); line-height: 0.98; letter-spacing: -0.06em; }
    p { margin: 0 0 28px; color: var(--muted); }
    a { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 18px; border-radius: 12px; background: var(--green); color: #071009; text-decoration: none; font-weight: 700; }
    a:hover { background: #adf8c1; }
    :focus-visible { outline: 2px solid var(--green); outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <p class="code">Error 404</p>
    <h1>Nothing lives here.</h1>
    <p>The page you were looking for moved or never existed.</p>
    <a href="/">Return to Cayden’s bio</a>
  </main>
</body>
</html>
